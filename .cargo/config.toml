[build]
target = "thumbv7em-none-eabihf"

[target.thumbv7em-none-eabihf]
# Tell LLVM this is a Cortex-M4. There VMLA is slower than VMUL plus VADD,
# so the dot products compile to the pair. Measured: 2 percent faster
# training, same bits out.
rustflags = ["-C", "link-arg=-Tlink.x", "-C", "target-cpu=cortex-m4"]
runner = "probe-rs run --chip nRF52833_xxAA"
